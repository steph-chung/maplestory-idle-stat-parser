services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  api:
    build: .
    command: uvicorn app.api:app --host 0.0.0.0 --port 8000
    environment:
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      CP_TEMPLATE_PATH: /app/cp_template.png
      # Lock this down later; for local testing it's fine
      CORS_ORIGINS: "*"
      # IMPORTANT: make API write uploads to the shared volume path
      UPLOAD_DIR: /shared/uploads
    volumes:
      - shared-data:/shared
    ports:
      - "8000:8000"
    depends_on:
      - redis

  worker:
    build: .
    command: celery -A app.celery_app.celery_app worker --loglevel=INFO --concurrency=2
    environment:
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      CP_TEMPLATE_PATH: /app/cp_template.png
      # Worker needs access to the same upload dir
      UPLOAD_DIR: /shared/uploads
    volumes:
      - shared-data:/shared
    depends_on:
      - redis

volumes:
  shared-data:
